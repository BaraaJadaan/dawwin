<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dawwin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.png" alt="" width="26" height="26">
      <span class="name" data-i18n="app.name"></span>
      <span class="tag" data-i18n="app.tag"></span>
    </div>
    <div class="chips">
      <button class="chip" id="chip-status" data-goto="setup">
        <span class="dot"></span><span class="label"></span>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button class="btn btn-primary btn-block" id="btn-new">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        <span data-i18n="side.new"></span>
      </button>

      <section id="queue-section" hidden>
        <div class="queue-head">
          <h3 data-i18n="side.queue"></h3>
          <button class="linkbtn" id="queue-cancel-all" data-i18n="side.cancelAll" hidden></button>
        </div>
        <ul id="queue" class="queue"></ul>
      </section>

      <section class="history-section">
        <h3 data-i18n="side.history"></h3>
        <input id="history-filter" class="input input-sm" type="search" data-i18n-ph="side.filter" dir="auto">
        <ul id="history" class="history"></ul>
        <p id="history-empty" class="muted small" data-i18n="side.empty" hidden></p>
      </section>

      <button class="btn btn-ghost side-settings" id="btn-settings">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54a7 7 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.39 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.8a.5.5 0 0 0 .49-.42l.36-2.54a7 7 0 0 0 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
        <span data-i18n="set.title"></span>
      </button>
    </aside>

    <main id="main" class="main">
      <!-- home: drop zone -->
      <section id="view-home" class="view">
        <div id="dropzone" class="dropzone" tabindex="0" role="button" data-i18n-aria="home.chooseAria">
          <div class="dz-icon">
            <svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
              <rect x="6" y="18" width="4" height="12" rx="2" fill="currentColor" opacity=".5"/>
              <rect x="13" y="12" width="4" height="24" rx="2" fill="currentColor" opacity=".7"/>
              <rect x="20" y="6" width="4" height="36" rx="2" fill="currentColor"/>
              <rect x="27" y="13" width="4" height="22" rx="2" fill="currentColor" opacity=".7"/>
              <rect x="34" y="19" width="4" height="10" rx="2" fill="currentColor" opacity=".5"/>
            </svg>
          </div>
          <h1 data-i18n="home.drop"></h1>
          <p><span data-i18n="home.or"></span> <span class="link" data-i18n="home.choose"></span> <span data-i18n="home.or"></span> <span class="link" id="home-folder" data-i18n="home.folder"></span><span data-i18n="home.formats"></span></p>
          <div class="lang" role="radiogroup" data-i18n-aria="home.spoken">
            <span class="muted small" data-i18n="home.spoken"></span>
            <div class="segmented">
              <button type="button" role="radio" data-lang="ar" data-i18n="home.ar"></button>
              <button type="button" role="radio" data-lang="en" data-i18n="home.en"></button>
            </div>
          </div>
        </div>
        <div id="home-note" class="home-note"></div>
      </section>

      <!-- setup: choose a model, download it, ready -->
      <section id="view-setup" class="view" hidden>
        <div class="setup">
          <div class="setup-head"><h1 data-i18n="setup.title"></h1></div>

          <ol class="stepper">
            <li data-step="choose"><button type="button"><span class="bullet">1</span><span class="s-text"><span class="s-label" data-i18n="step.choose"></span><span class="s-state muted"></span></span></button></li>
            <li data-step="download"><button type="button"><span class="bullet">2</span><span class="s-text"><span class="s-label" data-i18n="step.download"></span><span class="s-state muted"></span></span></button></li>
            <li data-step="ready"><button type="button"><span class="bullet">3</span><span class="s-text"><span class="s-label" data-i18n="step.ready"></span><span class="s-state muted"></span></span></button></li>
          </ol>

          <!-- 1. choose -->
          <section class="card panel" id="panel-choose" hidden>
            <h2 data-i18n="step.choose"></h2>
            <div class="model-cards" id="model-cards" role="radiogroup" data-i18n-aria="step.choose"></div>
            <div class="row small dest">
              <span class="muted" data-i18n="setup.savesTo"></span>
              <code id="download-dir" dir="ltr"></code>
              <button class="btn btn-sm btn-ghost" id="btn-download-dir" data-i18n="setup.change"></button>
            </div>
            <div class="row">
              <button class="btn btn-primary" id="btn-choose-go"></button>
              <button class="btn btn-ghost" id="btn-import" data-i18n="setup.import"></button>
              <button class="btn btn-ghost" id="btn-manual" data-i18n="choose.manual"></button>
            </div>
            <p id="import-error" class="error" dir="auto" hidden></p>
          </section>

          <!-- 2. download -->
          <section class="card panel" id="panel-download" hidden>
            <h2 id="download-title"></h2>
            <div id="download-box">
              <div class="progress" id="download-progress"><div class="bar" id="download-bar"></div></div>
              <p class="small" id="download-text"></p>
            </div>
            <div class="row">
              <button class="btn btn-primary" id="btn-download"></button>
              <button class="btn btn-ghost" id="btn-download-back" data-i18n="dl.other"></button>
            </div>
            <p id="download-error" class="error" dir="auto" hidden></p>
          </section>

          <!-- 3. ready -->
          <section class="card panel" id="panel-ready" hidden>
            <h2 data-i18n="ready.title"></h2>
            <p class="muted" id="ready-text"></p>
            <div class="row"><button class="btn btn-primary" id="btn-start" data-i18n="ready.start"></button></div>
          </section>
        </div>
      </section>

      <!-- settings -->
      <section id="view-settings" class="view" hidden>
        <div class="setup">
          <div class="setup-head"><h1 data-i18n="set.title"></h1></div>

          <section class="card group">
            <h2 data-i18n="set.general"></h2>
            <div class="setting">
              <div class="setting-text"><h3 data-i18n="app.uiLang"></h3></div>
              <select id="set-lang" class="input select" data-i18n-aria="app.uiLang"></select>
            </div>
          </section>

          <section class="card group">
            <h2 data-i18n="set.engine"></h2>
            <div class="setting">
              <div class="setting-text">
                <h3 data-i18n="setup.runOn"></h3>
                <p class="muted small" id="runon-detail"></p>
              </div>
              <select id="run-on" class="input select" data-i18n-aria="setup.runOn">
                <option value="auto" data-i18n="runon.auto"></option>
                <option value="cpu" data-i18n="runon.cpu"></option>
              </select>
            </div>
            <div class="setting">
              <div class="setting-text">
                <h3 data-i18n="setup.decoder"></h3>
                <p class="muted small" id="ffmpeg-detail"></p>
              </div>
            </div>
          </section>

          <section class="card group">
            <h2 data-i18n="step.model"></h2>
            <div id="set-models"></div>
            <div class="setting" id="set-custom" hidden><div class="setting-text"><p class="muted small" id="set-custom-text"></p></div></div>
            <div class="setting actions">
              <button class="btn btn-sm" id="set-import" data-i18n="set.importModel"></button>
              <button class="btn btn-sm btn-ghost" id="set-download-dir" data-i18n="set.downloadDir"></button>
              <button class="btn btn-sm btn-ghost" id="set-model-folder" data-i18n="set.showFolder"></button>
            </div>
            <p id="set-import-error" class="error setting-error" dir="auto" hidden></p>
          </section>

          <section class="card group" id="set-old-box" hidden>
            <h2 data-i18n="set.oldEngine"></h2>
            <div class="setting">
              <div class="setting-text"><p class="muted small" id="set-old-text"></p></div>
              <button class="btn btn-sm" id="set-old-remove" data-i18n="set.oldRemove"></button>
            </div>
          </section>

          <section class="card group">
            <h2 data-i18n="set.folderJobs"></h2>
            <div class="setting">
              <div class="setting-text">
                <h3 data-i18n="set.folderFiles"></h3>
                <div class="format-list" id="set-folder-formats"></div>
              </div>
            </div>
          </section>

          <section class="card group">
            <h2 data-i18n="set.updates"></h2>
            <div class="setting">
              <div class="setting-text">
                <h3 id="set-version"></h3>
                <p class="small" id="set-update-status"></p>
              </div>
              <button class="btn btn-sm btn-primary" id="set-check" data-i18n="set.check"></button>
            </div>
            <div class="setting">
              <label class="toggle"><input type="checkbox" id="set-auto-check"> <span data-i18n="set.autoCheck"></span></label>
            </div>
          </section>

          <section class="card group">
            <h2 data-i18n="set.folders"></h2>
            <div class="setting actions">
              <button class="btn btn-sm" id="btn-data" data-i18n="setup.data"></button>
              <button class="btn btn-sm" id="btn-log" data-i18n="setup.log"></button>
              <button class="btn btn-sm btn-ghost" id="btn-recheck" data-i18n="setup.recheck"></button>
            </div>
          </section>

          <section class="card group">
            <h2 data-i18n="set.about"></h2>
            <div class="setting"><div class="setting-text"><p class="muted small" id="set-about"></p></div></div>
            <div class="setting actions">
              <button class="btn btn-sm btn-ghost" id="set-github" data-i18n="set.github"></button>
              <button class="btn btn-sm btn-ghost" id="set-issue" data-i18n="set.report"></button>
            </div>
          </section>
        </div>
      </section>

      <!-- transcript -->
      <section id="view-transcript" class="view view-transcript" hidden>
        <div class="t-head">
          <div class="t-title-row">
            <h1 id="t-title" class="t-title" dir="auto" spellcheck="false"></h1>
            <span id="t-partial" class="badge badge-warn" data-i18n="t.partial" hidden></span>
          </div>
          <p id="t-meta" class="muted small"></p>
          <div id="t-progress" class="t-progress" hidden>
            <div class="progress"><div class="bar" id="t-bar"></div></div>
            <div class="t-progress-row">
              <span id="t-status" class="small"></span>
              <button class="btn btn-sm btn-ghost" id="t-cancel" data-i18n="t.cancel"></button>
            </div>
          </div>
          <div class="toolbar">
            <div class="search">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
              <input id="search" type="search" data-i18n-ph="t.search" dir="auto" autocomplete="off">
              <span id="search-count" class="muted small" dir="ltr"></span>
              <button class="icon-btn" id="search-prev" data-i18n-aria="t.prev">‹</button>
              <button class="icon-btn" id="search-next" data-i18n-aria="t.next">›</button>
            </div>
            <label class="toggle small"><input type="checkbox" id="follow"> <span data-i18n="t.follow"></span></label>
            <label class="toggle small"><input type="checkbox" id="stamps" checked> <span data-i18n="t.stamps"></span></label>
            <button class="btn btn-sm" id="btn-copy" data-i18n="t.copyAll"></button>
            <div class="menu-wrap">
              <button class="btn btn-sm btn-primary" id="btn-export" aria-haspopup="true" data-i18n="t.export"></button>
              <div class="menu" id="export-menu" hidden>
                <button data-fmt="docx" data-i18n="exp.docx"></button>
                <button data-fmt="txt" data-i18n="exp.txt"></button>
                <button data-fmt="md" data-i18n="exp.md"></button>
                <button data-fmt="srt" data-i18n="exp.srt"></button>
                <button data-fmt="vtt" data-i18n="exp.vtt"></button>
                <button data-fmt="csv" data-i18n="exp.csv"></button>
                <button data-fmt="tsv" data-i18n="exp.tsv"></button>
                <button data-fmt="json" data-i18n="exp.json"></button>
              </div>
            </div>
            <button class="icon-btn danger" id="btn-delete" data-i18n-aria="t.delete">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 12H7L6 9Zm4 2v8h2v-8h-2Zm4 0v8h2v-8h-2Z"/></svg>
            </button>
          </div>
        </div>
        <div id="segments" class="segments"></div>
        <div class="player" id="player" hidden>
          <audio id="audio" controls preload="metadata"></audio>
          <div class="volume" id="volume" dir="ltr">
            <button class="icon-btn" id="btn-mute" data-i18n-aria="player.mute">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 9.500v5h3.500L12 19V5L7.500 9.500H4Z" fill="currentColor"/>
                <path class="on" d="M15.500 9a4 4 0 0 1 0 6M18 6.500a8 8 0 0 1 0 11"/>
                <path class="off" d="m16 9.500 5 5m0-5-5 5"/>
              </svg>
            </button>
            <input type="range" id="volume-bar" min="0" max="100" step="1" data-i18n-aria="player.volume">
          </div>
          <span id="player-note" class="muted small"></span>
        </div>
      </section>
    </main>
  </div>

  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-card" data-i18n="drop.overlay"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="ctx-menu" class="menu ctx-menu" role="menu" hidden>
    <button role="menuitem" id="ctx-play" data-i18n="ctx.play"></button>
    <button role="menuitem" id="ctx-copy" data-i18n="ctx.copy"></button>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
