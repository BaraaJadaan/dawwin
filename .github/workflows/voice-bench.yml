name: Voice bench

# Which voices Dawwin offers for reading aloud (issue 6). Every candidate reads the same Arabic and
# English passages (tools/bench-voice/texts.json) through audio.cpp's official Windows build, on the
# runner's processor, a sentence at a time as Dawwin reads. "listen" is a page to compare them by ear,
# by letter; "key" says which letter is which model, with its size, license, speed and memory.
# A model that needs a recording to speak like reads from voices VoxCPM 2 made from a description.
on:
  workflow_dispatch:
  # until this file is on main, a push to the 1.7.0 branch is how it starts; that trigger goes before the merge
  push:
    branches: [claude/dawwin-1-7-0-e06241]
    paths:
      - "tools/bench-voice/**"
      - ".github/workflows/voice-bench.yml"
      - "voice/**"

env:
  AUDIOCPP: v0.9.4
  PYTHONUTF8: "1"

jobs:
  # Dawwin's own voice program with audio.cpp's library: the GPU build and the processor build,
  # on a real voice, against audio.cpp's CLI; and the pack the app would download.
  program:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet huggingface_hub
      - name: dawwin-voice.exe
        run: cargo build --release --locked --manifest-path voice/Cargo.toml
      - name: audio.cpp's library (both builds) and its CLI
        shell: pwsh
        run: |
          $base = "https://github.com/0xShug0/audio.cpp/releases/download/$env:AUDIOCPP"
          foreach ($b in "cpu", "vulkan") {
            curl.exe -sSL --fail --retry 5 -o "lib-$b.zip" "$base/audio-$env:AUDIOCPP-lib-windows-x64-$b.zip"
            Expand-Archive "lib-$b.zip" "lib-$b"
            New-Item -ItemType Directory -Force "voice-$b" | Out-Null
            Get-ChildItem "lib-$b" -Recurse -Filter *.dll | Copy-Item -Destination "voice-$b"
            Get-ChildItem "lib-$b" -Recurse -Include LICENSE*, NOTICE* | Copy-Item -Destination "voice-$b"
            Copy-Item voice/target/release/dawwin-voice.exe "voice-$b"
            Write-Host "== $b"; Get-ChildItem "voice-$b" | Format-Table Name, Length
          }
          curl.exe -sSL --fail --retry 5 -o cli.zip "$base/audio-$env:AUDIOCPP-bin-windows-x64-cpu.zip"
          Expand-Archive cli.zip cli
          "CLI=" + (Get-ChildItem cli -Recurse -Filter audiocpp_cli.exe | Select-Object -First 1).FullName >> $env:GITHUB_ENV
      - name: A real voice through it, processor build
        run: python tools/bench-voice/program.py voice-cpu "$env:CLI" models out-program cpu
      - name: The same with the GPU build, on a runner that has no GPU
        continue-on-error: true
        run: python tools/bench-voice/program.py voice-vulkan "$env:CLI" models out-program vulkan
      - name: Pack
        shell: pwsh
        run: python tools/pack.py packs/dawwin-voice-audio.cpp-v0.9.4.tar.xz voice-cpu | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: The app's own reading code with this program and a real voice (mixed Arabic and English, numbers)
        shell: pwsh
        run: |
          $env:DAWWIN_TEST_VOICE_EXE = (Resolve-Path voice-cpu/dawwin-voice.exe).Path
          $env:DAWWIN_TEST_VOICE_MODEL = (Get-ChildItem models -Recurse -Filter supertonic-3-f16.gguf | Select-Object -First 1).FullName
          $env:DAWWIN_TEST_VOICE_OUT = "$PWD\out-program\app"
          cargo test --manifest-path src-tauri/Cargo.toml --locked real_voice -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program
          path: |
            out-program/
            packs/

  # the voices take hours: on a push they run only when its message asks for them with [bench]
  refs:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bench]') }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet huggingface_hub psutil
      - name: audio.cpp, the build Dawwin would ship
        shell: pwsh
        run: |
          $base = "https://github.com/0xShug0/audio.cpp/releases/download/$env:AUDIOCPP"
          curl.exe -sSL --fail --retry 5 -o vk.zip "$base/audio-$env:AUDIOCPP-bin-windows-x64-vulkan.zip"
          Expand-Archive vk.zip acpp
          $cli = (Get-ChildItem acpp -Recurse -Filter audiocpp_cli.exe | Select-Object -First 1).FullName
          & $cli --list-devices --json
          if ($LASTEXITCODE -ne 0) {
            curl.exe -sSL --fail --retry 5 -o cpu.zip "$base/audio-$env:AUDIOCPP-bin-windows-x64-cpu.zip"
            Expand-Archive cpu.zip acpp-cpu
            $cli = (Get-ChildItem acpp-cpu -Recurse -Filter audiocpp_cli.exe | Select-Object -First 1).FullName
          }
          "CLI=$cli" >> $env:GITHUB_ENV
      - name: The ready-made voices
        run: python tools/bench-voice/run.py --make-refs "$env:CLI" models refs
      - uses: actions/upload-artifact@v4
        with:
          name: refs
          path: refs/*.wav

  bench:
    needs: refs
    if: ${{ !cancelled() && needs.refs.result != 'skipped' }}
    runs-on: windows-2022
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - { candidate: supertonic3-f16, sexes: "m,f" }
          - { candidate: supertonic3-orig, sexes: "f" }
          - { candidate: magpie-q8, sexes: "m,f" }
          - { candidate: phonon-31m-q8, sexes: "m,f" }
          - { candidate: lfm3-audio-q8, sexes: "m" }
          - { candidate: lfm3-audio-q8, sexes: "f" }
          - { candidate: voxcpm2-q8, sexes: "m" }
          - { candidate: voxcpm2-q8, sexes: "f" }
          - { candidate: chatterbox-mtl3-q8, sexes: "m" }
          - { candidate: chatterbox-mtl3-q8, sexes: "f" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet huggingface_hub psutil
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: refs
          path: refs
      - name: audio.cpp, the build Dawwin would ship
        shell: pwsh
        run: |
          $base = "https://github.com/0xShug0/audio.cpp/releases/download/$env:AUDIOCPP"
          curl.exe -sSL --fail --retry 5 -o vk.zip "$base/audio-$env:AUDIOCPP-bin-windows-x64-vulkan.zip"
          Expand-Archive vk.zip acpp
          $cli = (Get-ChildItem acpp -Recurse -Filter audiocpp_cli.exe | Select-Object -First 1).FullName
          $list = & $cli --list-devices --json 2>&1 | Out-String
          $ok = $LASTEXITCODE -eq 0
          New-Item -ItemType Directory -Force out | Out-Null
          if ($ok) {
            "Vulkan build of audio.cpp $env:AUDIOCPP started on a runner without a GPU. Devices: $list" | Out-File -Encoding utf8 out/runtime.txt
          } else {
            "Vulkan build of audio.cpp $env:AUDIOCPP did not start on a runner without a GPU (exit $LASTEXITCODE): $list. The CPU build was used." | Out-File -Encoding utf8 out/runtime.txt
            curl.exe -sSL --fail --retry 5 -o cpu.zip "$base/audio-$env:AUDIOCPP-bin-windows-x64-cpu.zip"
            Expand-Archive cpu.zip acpp-cpu
            $cli = (Get-ChildItem acpp-cpu -Recurse -Filter audiocpp_cli.exe | Select-Object -First 1).FullName
          }
          Get-Content out/runtime.txt
          (Get-CimInstance Win32_Processor | Select-Object -First 1).Name | Out-File -Append -Encoding utf8 out/runtime.txt
          "CLI=$cli" >> $env:GITHUB_ENV
      - name: Speak
        run: python tools/bench-voice/run.py ${{ matrix.candidate }} "$env:CLI" models out --sexes "${{ matrix.sexes }}" --refs refs --budget-min 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.candidate }}-${{ strategy.job-index }}
          path: |
            out/**/*.wav
            out/**/*.jsonl
            out/**/*.json
            out/**/log.txt
            out/runtime.txt

  page:
    needs: bench
    if: ${{ !cancelled() && needs.bench.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: art
      - name: The page and the key
        run: python3 tools/bench-voice/page.py art listen key | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: listen
          path: listen/
      - uses: actions/upload-artifact@v4
        with:
          name: key
          path: key/
