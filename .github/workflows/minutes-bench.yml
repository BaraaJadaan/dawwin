name: Minutes bench

# Which local models Dawwin offers for minutes: every candidate writes the minutes of the made-up
# recordings in tools/bench-minutes/meetings through llama.cpp on a CPU, the way the app asks
# (src-tauri/prompts), and score.py scores them against the hand-made answers. Run it from the
# Actions tab; `models` picks some of the keys below.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Model keys, comma separated (empty: all)"
        default: ""
  # until this file is on main, a push to the 1.6.0 branch is the only way to start it
  push:
    branches: [claude/dawwin-1-6-0-7a404a]
    paths:
      - tools/bench-minutes/**
      - src-tauri/prompts/**
      - .github/workflows/minutes-bench.yml

env:
  LLAMA: b12237

jobs:
  minutes:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: qwen35-0.8b, url: "unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf" }
          - { key: qwen35-0.8b-q8, url: "unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q8_0.gguf" }
          - { key: qwen35-2b, url: "unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf" }
          - { key: qwen35-2b-q8, url: "unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q8_0.gguf" }
          - { key: qwen35-4b, url: "unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf" }
          - { key: qwen35-9b, url: "unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf" }
          - { key: gemma4-e2b, url: "unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf" }
          - { key: gemma4-e4b, url: "unsloth/gemma-4-E4B-it-GGUF/resolve/main/gemma-4-E4B-it-Q4_K_M.gguf" }
          - { key: gemma4-12b, url: "unsloth/gemma-4-12b-it-GGUF/resolve/main/gemma-4-12b-it-Q4_K_M.gguf" }
          - { key: ministral3-3b, url: "mistralai/Ministral-3-3B-Instruct-2512-GGUF/resolve/main/Ministral-3-3B-Instruct-2512-Q4_K_M.gguf" }
          - { key: ministral3-8b, url: "mistralai/Ministral-3-8B-Instruct-2512-GGUF/resolve/main/Ministral-3-8B-Instruct-2512-Q4_K_M.gguf" }
          - { key: ministral3-14b, url: "mistralai/Ministral-3-14B-Instruct-2512-GGUF/resolve/main/Ministral-3-14B-Instruct-2512-Q4_K_M.gguf" }
          - { key: granite42-3b, url: "ibm-granite/granite-4.2-3b-GGUF/resolve/main/granite-4.2-3b-Q4_K_M.gguf" }
          - { key: granite42-8b, url: "ibm-granite/granite-4.2-8b-GGUF/resolve/main/granite-4.2-8b-Q4_K_M.gguf" }
          - { key: phi4-mini, url: "bartowski/microsoft_Phi-4-mini-instruct-GGUF/resolve/main/microsoft_Phi-4-mini-instruct-Q4_K_M.gguf" }
          - { key: allam-7b, url: "bartowski/ALLaM-AI_ALLaM-7B-Instruct-preview-GGUF/resolve/main/ALLaM-AI_ALLaM-7B-Instruct-preview-Q4_K_M.gguf" }
          - { key: fanar1-9b, url: "mradermacher/Fanar-1-9B-Instruct-GGUF/resolve/main/Fanar-1-9B-Instruct.Q4_K_M.gguf" }
          - { key: jais3-0.9b, url: "IFM/Jais-3-0.9B-GGUF/resolve/main/Jais-3-0.9B-Q4_K_M.gguf", kwargs: '{"reasoning_effort": "low"}' }
          - { key: jais3-3.7b, url: "IFM/Jais-3-3.7B-GGUF/resolve/main/Jais-3-3.7B-Q4_K_M.gguf", kwargs: '{"reasoning_effort": "low"}' }
          - { key: jais3-7b, url: "IFM/Jais-3-7B-GGUF/resolve/main/Jais-3-7B-Q4_K_M.gguf", kwargs: '{"reasoning_effort": "low"}' }
          # the translation model Dawwin already downloads: expected not to do it well
          - { key: milmmt46-4b, url: "mradermacher/MiLMMT-46-4B-v1.0-GGUF/resolve/main/MiLMMT-46-4B-v1.0.Q4_K_M.gguf" }
    steps:
      - name: Wanted?
        id: want
        run: |
          wanted="${{ inputs.models }}"
          if [ -z "$wanted" ] || [[ ",$wanted," == *",${{ matrix.key }},"* ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.want.outputs.run == 'true'
      - name: Room on the disk
        if: steps.want.outputs.run == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: llama.cpp
        if: steps.want.outputs.run == 'true'
        run: |
          curl -L --fail --retry 5 -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA/llama-$LLAMA-bin-ubuntu-x64.tar.gz"
          mkdir llama && tar -xzf llama.tgz -C llama
          echo "SERVER=$(find "$PWD/llama" -name llama-server -type f | head -1)" >> "$GITHUB_ENV"
      - name: Model
        if: steps.want.outputs.run == 'true'
        run: curl -L --fail --retry 5 -o model.gguf "https://huggingface.co/${{ matrix.url }}" && ls -l model.gguf
      - name: Minutes
        if: steps.want.outputs.run == 'true'
        env:
          BENCH_KWARGS: ${{ matrix.kwargs }}
        run: mkdir out && python3 tools/bench-minutes/run.py ${{ matrix.key }} model.gguf "$SERVER" out
      - uses: actions/upload-artifact@v4
        if: always() && steps.want.outputs.run == 'true'
        with:
          name: out-${{ matrix.key }}
          path: out/

  score:
    needs: minutes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Score
        run: python3 tools/bench-minutes/score.py art results.md
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.*
