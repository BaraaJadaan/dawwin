name: Engine

# Builds the speech engine with GPU support, using the official Vulkan SDK. Official releases take
# their engine from here (see docs/how-it-works.md). It also downloads the real models over the
# real network, with a pause in the middle, and checks them.
on:
  workflow_dispatch:
  push:
    branches: [main, engine-check]
    paths:
      - "engine/**"
      - "src-tauri/src/models.rs"
      - "src-tauri/src/translate.rs"
      - "tools/stage-engine.mjs"
      - ".github/workflows/engine.yml"

env:
  VULKAN_VERSION: "1.4.335.0"

jobs:
  engine:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 5 -o vulkan-sdk.exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkan_sdk.exe"
          $root = "C:\VulkanSDK\$env:VULKAN_VERSION"
          $p = Start-Process -Wait -PassThru -FilePath .\vulkan-sdk.exe -ArgumentList "--root",$root,"--accept-licenses","--default-answer","--confirm-command","install"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          "$root\Bin" >> $env:GITHUB_PATH
      - name: Build
        run: cargo build --release --locked --features vulkan --manifest-path engine/Cargo.toml
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory engine-out | Out-Null
          Copy-Item engine/target/release/dawwin-engine.exe engine-out/
          Copy-Item engine/target/release/*.dll engine-out/
          if (-not (Test-Path engine-out/ggml-vulkan.dll)) { throw "no Vulkan backend in the build" }
          Get-ChildItem engine-out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: dawwin-engine-windows-x64
          path: engine-out/
          if-no-files-found: error

  models:
    # A machine without a GPU, on a fast connection: the whole first-run path for every model.
    needs: engine
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        model: [q4, q8, canary, whisper]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: dawwin-engine-windows-x64
          path: engine-out
      - name: Download the model, pause, resume, check
        env:
          DAWWIN_TEST_MODEL: ${{ matrix.model }}
          DAWWIN_TEST_DIR: ${{ runner.temp }}\models
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked real_download -- --ignored --nocapture
      - name: The engine loads it and reads a second of silence
        shell: pwsh
        run: |
          $model = Get-ChildItem "${{ runner.temp }}\models\*.gguf" | Select-Object -First 1
          $raw = Join-Path $env:RUNNER_TEMP "silence.f32"
          [IO.File]::WriteAllBytes($raw, (New-Object byte[] 64000))
          $requests = @(
            (@{ id = 1; cmd = "probe" } | ConvertTo-Json -Compress),
            (@{ id = 2; cmd = "load"; model = $model.FullName } | ConvertTo-Json -Compress),
            (@{ id = 3; cmd = "transcribe"; path = $raw; ranges = ,@(0, 16000); language = "en" } | ConvertTo-Json -Compress -Depth 4),
            (@{ id = 4; cmd = "quit" } | ConvertTo-Json -Compress)
          )
          $output = $requests | & .\engine-out\dawwin-engine.exe
          $output | ForEach-Object { Write-Host $_ }
          if (@($output | Where-Object { $_ -match '"ok":true' }).Count -ne 4) { throw "the engine failed" }

  speakers-and-language:
    # The speaker model and the language model, on a machine without a GPU: each downloaded with a
    # pause, then the engine tells the speakers apart in transcribe.cpp's own two-voice and
    # one-voice recordings, stops a long run when asked, and names the language of its samples.
    needs: engine
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: dawwin-engine-windows-x64
          path: engine-out
      - name: Download both models, pause, resume, check
        shell: pwsh
        run: |
          foreach ($m in "speakers", "language") {
            $env:DAWWIN_TEST_MODEL = $m
            $env:DAWWIN_TEST_DIR = "$env:RUNNER_TEMP\models"
            cargo test --manifest-path src-tauri/Cargo.toml --locked real_download -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Sample recordings of transcribe.cpp (at the version the engine pins)
        shell: pwsh
        run: |
          New-Item -ItemType Directory samples | Out-Null
          foreach ($f in "sortformer-2spk-mix.wav", "multitalker-2spk-mix.wav", "jfk.wav", "dots-full.wav", "ar-short.wav", "fleurs-en.wav", "fleurs-de.wav", "fleurs-fr.wav", "fleurs-es.wav", "ru-short.wav", "ja-short.wav", "zh-short.wav") {
            curl.exe -L --fail --retry 5 -s -o "samples\$f" "https://raw.githubusercontent.com/handy-computer/transcribe.cpp/v0.4.1/samples/$f"
            if ($LASTEXITCODE -ne 0) { throw "no $f" }
          }
          Get-ChildItem samples | Format-Table Name, Length
      - name: Who speaks, and which language
        shell: pwsh
        run: |
          $env:DAWWIN_TEST_ENGINE = (Resolve-Path engine-out\dawwin-engine.exe).Path
          $env:DAWWIN_TEST_SPEAKERS = "$env:RUNNER_TEMP\models\diar_streaming_sortformer_4spk-v2.1-Q8_0.gguf"
          $env:DAWWIN_TEST_LANGUAGE = "$env:RUNNER_TEMP\models\lang-id-voxlingua107-ecapa-Q8_0.gguf"
          $env:DAWWIN_TEST_SAMPLES = (Resolve-Path samples).Path
          cargo test --manifest-path src-tauri/Cargo.toml --locked real_speakers_and_language -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  translator:
    # The translator as the app ships it (llama.cpp's official build), with each translation model,
    # on a machine without a GPU: download with a pause, load, translate Arabic, English and Danish.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        model: [milmmt-1b, milmmt-4b, milmmt-12b]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The translator, as the app's build stages it
        run: node tools/stage-engine.mjs --translator-only
      - name: Download the model, pause, resume, check
        env:
          DAWWIN_TEST_MODEL: ${{ matrix.model }}
          DAWWIN_TEST_DIR: ${{ runner.temp }}\models
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked real_download -- --ignored --nocapture
      - name: Translate, as it starts by default
        shell: pwsh
        run: |
          $env:DAWWIN_TEST_TRANSLATOR = (Resolve-Path src-tauri\engine-bin\translate\llama-server.exe).Path
          $env:DAWWIN_TEST_MODEL_FILE = (Get-ChildItem "$env:RUNNER_TEMP\models\*.gguf" | Select-Object -First 1).FullName
          cargo test --manifest-path src-tauri/Cargo.toml --locked real_translation -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Translate, with the GPU kept out
        shell: pwsh
        run: |
          $env:DAWWIN_TEST_TRANSLATOR = (Resolve-Path src-tauri\engine-bin\translate\llama-server.exe).Path
          $env:DAWWIN_TEST_MODEL_FILE = (Get-ChildItem "$env:RUNNER_TEMP\models\*.gguf" | Select-Object -First 1).FullName
          $env:DAWWIN_TEST_CPU = "1"
          cargo test --manifest-path src-tauri/Cargo.toml --locked real_translation -- --ignored --nocapture
