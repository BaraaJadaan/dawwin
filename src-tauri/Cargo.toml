[package]
name = "dawwin"
version = "1.3.1"
description = "Local speech-to-text, translation and subtitles, Arabic first"
edition = "2021"
license = "MIT"
repository = "https://github.com/BaraaJadaan/dawwin"
authors = ["Baraa Jadaan"]

[lib]
name = "dawwin_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# the tools Dawwin downloads come as .tar.xz
lzma-rs = "0.3"
tar = { version = "0.4", default-features = false }
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mkv", "mp3", "wav", "pcm", "flac", "ogg", "vorbis", "adpcm"] }
rubato = "0.16"
# 1.8.0, read anything on the screen: PDFs through pdfium.dll (a tool, downloaded with the first PDF)
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe"] }
# pdfium-binaries comes as a .tgz
flate2 = "1"

[target.'cfg(windows)'.dependencies]
# 1.8.0: the selection in other programs (UI Automation, the clipboard, Ctrl+C), the shortcut,
# Start with Windows, and Windows' own OCR for pictures of text
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
