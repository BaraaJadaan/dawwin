[package]
name = "dawwin"
version = "1.3.1"
description = "Local speech-to-text, translation and subtitles, Arabic first"
edition = "2021"
license = "MIT"
repository = "https://github.com/BaraaJadaan/dawwin"
authors = ["Baraa Jadaan"]

[lib]
name = "dawwin_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# the tools Dawwin downloads come as .tar.xz
lzma-rs = "0.3"
tar = { version = "0.4", default-features = false }
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mkv", "mp3", "wav", "pcm", "flac", "ogg", "vorbis", "adpcm"] }
rubato = "0.16"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
