[package]
name = "trial-pdf"
version = "0.1.0"
edition = "2021"
publish = false
description = "Trial for Dawwin 1.8.0: Arabic text out of PDFs, PDFium against pdf_oxide, and Windows' own OCR for scans"

# not part of the app's build: a program of its own, run by hand
[workspace]

[dependencies]
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe"] }
pdf_oxide = { version = "0.3.78", default-features = false }
unicode-normalization = "0.1"
serde_json = "1"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage",
    "Storage_Streams",
    "Data_Pdf",
] }
