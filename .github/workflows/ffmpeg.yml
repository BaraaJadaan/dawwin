name: FFmpeg

# Dawwin's own small ffmpeg (tools/ffmpeg/build.sh), in two sizes: "audio", what the app itself
# needs, and "video", which can also burn subtitles into the picture. Each is built, measured, and
# tried on Windows on real files of the kinds people bring.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/ffmpeg/**"
      - ".github/workflows/ffmpeg.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [audio, video]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mingw-w64 nasm meson ninja-build pkg-config autoconf automake libtool xz-utils zip
      - name: Build
        run: bash tools/ffmpeg/build.sh ${{ matrix.variant }}
      - name: Sizes
        run: |
          cd out
          f=ffmpeg-${{ matrix.variant }}.exe
          xz -9e -k "$f"
          zip -9 -q "$f.zip" "$f"
          echo "### ${{ matrix.variant }}" >> "$GITHUB_STEP_SUMMARY"
          for x in "$f" "$f.xz" "$f.zip"; do echo "$(stat -c %s "$x") $x"; done | tee -a "$GITHUB_STEP_SUMMARY"
          rm "$f.xz" "$f.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.variant }}
          path: out/

  samples:
    # Files of the kinds people bring, made with Ubuntu's full ffmpeg: only for the test.
    runs-on: ubuntu-24.04
    steps:
      - name: Make them
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          mkdir s && cd s
          v="-f lavfi -i testsrc2=size=1280x720:rate=30:duration=30"
          ffmpeg -loglevel error $v -f lavfi -i "sine=frequency=300:duration=30" -c:v libx264 -preset veryfast -c:a aac -ac 1 -ar 32000 meeting.mp4
          ffmpeg -loglevel error -i meeting.mp4 -c copy obs.mkv
          ffmpeg -loglevel error $v -f lavfi -i "sine=frequency=300:duration=30" -c:v libx264 -preset veryfast -c:a ac3 -ac 6 film.mkv
          ffmpeg -loglevel error $v -f lavfi -i "sine=frequency=300:duration=30" -c:v libvpx-vp9 -deadline realtime -b:v 1M -c:a libopus browser.webm
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=300:duration=10" -c:a libopus whatsapp.ogg
          printf '1\n00:00:01,000 --> 00:00:05,000\nطيب، خلونا نبدأ الاجتماع\n\n2\n00:00:06,000 --> 00:00:10,000\nOkay, let'"'"'s start the meeting\n\n' > subtitles.srt
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: s/

  try:
    needs: [build, samples]
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Read the sound, save it, add subtitle tracks
        shell: pwsh
        run: |
          $s = "art\samples"
          foreach ($variant in "audio", "video") {
            $ff = "art\ffmpeg-$variant\ffmpeg-$variant.exe"
            Write-Host "== $variant"
            foreach ($f in "meeting.mp4", "obs.mkv", "film.mkv", "browser.webm", "whatsapp.ogg") {
              & $ff -nostdin -loglevel error -i "$s\$f" -vn -ac 1 -ar 16000 -f f32le "out-$f.f32"
              $n = (Get-Item "out-$f.f32").Length / 4 / 16000
              Write-Host ("read {0}: {1:N1} s of sound" -f $f, $n)
              if ($LASTEXITCODE -ne 0 -or $n -lt 9) { throw "$variant could not read $f" }
            }
            & $ff -nostdin -loglevel error -y -i "$s\film.mkv" -vn -map 0:a:0 -c:a aac -b:a 128k "film-$variant.m4a"
            if ($LASTEXITCODE -ne 0) { throw "$variant could not save the sound as M4A" }
            & $ff -nostdin -loglevel error -y -i "$s\meeting.mp4" -f srt -i "$s\subtitles.srt" -map 0:v? -map 0:a? -map 1:0 -c copy -c:s mov_text -metadata:s:s:0 language=ara "sub-$variant.mp4"
            if ($LASTEXITCODE -ne 0) { throw "$variant could not add a subtitle track to an MP4" }
            & $ff -nostdin -loglevel error -y -i "$s\film.mkv" -f srt -i "$s\subtitles.srt" -map 0 -map 1:0 -c copy -c:s srt "sub-$variant.mkv"
            if ($LASTEXITCODE -ne 0) { throw "$variant could not add a subtitle track to an MKV" }
            Write-Host "M4A and subtitle tracks: fine"
          }
      - name: Burn subtitles into the picture (video only)
        shell: pwsh
        run: |
          $s = "art\samples"; $ff = "art\ffmpeg-video\ffmpeg-video.exe"
          Copy-Item "$s\subtitles.srt" subtitles.srt
          foreach ($enc in "h264_mf") {
            $t = Measure-Command { & $ff -nostdin -loglevel error -y -i "$s\meeting.mp4" -vf "subtitles=subtitles.srt" -c:v $enc -b:v 3M -c:a copy "burned-$enc.mp4" }
            if ($LASTEXITCODE -ne 0) { throw "burning with $enc failed" }
            Write-Host ("{0}: 30 s of 720p in {1:N1} s, {2:N0} KB" -f $enc, $t.TotalSeconds, ((Get-Item "burned-$enc.mp4").Length / 1KB))
          }
          & $ff -nostdin -loglevel error -i burned-h264_mf.mp4 -vn -f null - ; if ($LASTEXITCODE -ne 0) { throw "the burned video does not read back" }
      - uses: actions/upload-artifact@v4
        with:
          name: burned
          path: burned-*.mp4
