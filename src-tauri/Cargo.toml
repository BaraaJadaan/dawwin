[package]
name = "tafreegh"
version = "1.0.0"
description = "Local Arabic speech-to-text with Cohere Transcribe Arabic"
edition = "2021"
license = "MIT"
repository = "https://github.com/BaraaJadaan/tafreegh"
authors = ["Baraa Jadaan"]

[lib]
name = "tafreegh_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "wav", "pcm", "flac", "ogg", "vorbis", "adpcm"] }
rubato = "0.16"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
